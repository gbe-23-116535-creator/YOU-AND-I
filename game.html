<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SQUAD SHOWDOWN</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#050b14;
color:white;
overflow:hidden;
}


header{
height:60px;
background:#000;
border-bottom:2px solid orange;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 30px;
font-weight:bold;
}


.title{
color:#f39c12;
font-size:22px;
}


.vote{
padding:15px;
background:#111827;
text-align:center;
}


button{
padding:12px 25px;
border:0;
font-weight:bold;
cursor:pointer;
border-radius:5px;
font-size:16px;
}


.gamst{
background:#f1c40f;
}


.hmb{
background:#e74c3c;
color:white;
}


.bar{
height:25px;
background:#222;
display:flex;
margin-top:15px;
}


#gamstBar{
background:#f1c40f;
width:50%;
}


#hmbBar{
background:#e74c3c;
width:50%;
}


canvas{

display:block;
margin:15px auto;
background:#0b1322;
border:2px solid #1e3a8a;

}



.info{

display:flex;
justify-content:center;
gap:40px;
font-size:20px;

}

</style>

</head>


<body>


<header>

<div>← 대문</div>

<div class="title">
SQUAD SHOWDOWN
</div>

<div>
LIVE
</div>

</header>



<div class="vote">


<h2>
⚔ 진영 선택
</h2>


<button class="gamst" onclick="vote('gamst')">
감스트 팀
</button>


<button class="hmb" onclick="vote('hmb')">
홍명보 팀
</button>



<div class="info">

<div>
감스트 :
<span id="gv">
0
</span>
표
</div>


<div>
홍명보 :
<span id="hv">
0
</span>
표
</div>


</div>



<div class="bar">

<div id="gamstBar"></div>

<div id="hmbBar"></div>

</div>


</div>




<canvas id="game"
width="1000"
height="400">

</canvas>



<script>


let gamstVote=0;

let hmbVote=0;


let team=null;



let player=null;



function vote(t){


if(team){
alert("이미 선택했습니다");
return;
}


team=t;



if(t=="gamst"){

gamstVote++;

player={

x:100,

y:200,

color:"#f1c40f",

hp:100

};


}else{


hmbVote++;


player={

x:900,

y:200,

color:"#e74c3c",

hp:100

};


}


updateVote();


}



function updateVote(){


let total=gamstVote+hmbVote;


let g=50;


if(total){

g=gamstVote/total*100;

}


document.getElementById("gv").innerHTML=gamstVote;

document.getElementById("hv").innerHTML=hmbVote;


document.getElementById("gamstBar").style.width=g+"%";

document.getElementById("hmbBar").style.width=(100-g)+"%";


}



const canvas=document.getElementById("game");

const ctx=canvas.getContext("2d");



let keys={};



document.addEventListener("keydown",e=>{

keys[e.key]=true;

});


document.addEventListener("keyup",e=>{

keys[e.key]=false;

});



function loop(){


ctx.clearRect(
0,
0,
1000,
400
);



if(player){


if(keys["ArrowLeft"])
player.x-=5;


if(keys["ArrowRight"])
player.x+=5;


if(keys["ArrowUp"])
player.y-=5;


if(keys["ArrowDown"])
player.y+=5;



ctx.fillStyle=player.color;


ctx.beginPath();


ctx.arc(
player.x,
player.y,
20,
0,
Math.PI*2
);


ctx.fill();


}


requestAnimationFrame(loop);


}


loop();



</script>


</body>
</html>
