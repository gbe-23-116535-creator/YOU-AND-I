<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>감스트 VS 홍명보 축구전</title>

<style>

body{
    margin:0;
    background:#07111f;
    color:white;
    font-family:Arial;
    text-align:center;
}


#startPage,
#selectPage,
#gamePage{

    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

}


#selectPage,
#gamePage{

    display:none;

}


button{

    padding:15px 40px;
    margin:10px;
    border:0;
    border-radius:10px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;

}


.start{

    background:#f39c12;

}


.gamst{

    background:#f1c40f;

}


.hmb{

    background:#e74c3c;
    color:white;

}


canvas{

    background:#14833b;
    border:4px solid white;

}


</style>

</head>


<body>


<div id="startPage">


<h1>
⚽ SQUAD SHOWDOWN
</h1>

<h2>
감스트 VS 홍명보
</h2>


<button class="start" onclick="openSelect()">
게임 시작
</button>


</div>





<div id="selectPage">


<h1>
팀 선택
</h1>


<h2>
감스트 투표 :
<span id="gamstVote">0</span>
</h2>


<h2>
홍명보 투표 :
<span id="hmbVote">0</span>
</h2>



<button class="gamst" onclick="startMatch('gamst')">
감스트 팀
</button>



<button class="hmb" onclick="startMatch('hmb')">
홍명보 팀
</button>


</div>





<div id="gamePage">


<h1>
축구 경기
</h1>


<canvas id="field" width="900" height="500"></canvas>


<p>
방향키 이동 / SPACE 슛
</p>


</div>





<script>


const canvas=document.getElementById("field");

const ctx=canvas.getContext("2d");



let gamstVote=0;

let hmbVote=0;



let started=false;



let player={

x:200,
y:250,
color:"#f1c40f"

};



let enemy={

x:700,
y:250,
color:"#e74c3c"

};



let ball={

x:450,
y:250,
speedX:0

};



let keys={};





function openSelect(){


document.getElementById("startPage").style.display="none";

document.getElementById("selectPage").style.display="flex";


}





function startMatch(team){



if(team==="gamst"){

gamstVote++;

player.x=200;

player.color="#f1c40f";


}else{


hmbVote++;

player.x=700;

player.color="#e74c3c";


}



document.getElementById("gamstVote").innerText=gamstVote;

document.getElementById("hmbVote").innerText=hmbVote;



document.getElementById("selectPage").style.display="none";

document.getElementById("gamePage").style.display="flex";



if(!started){

started=true;

gameLoop();

}


}






document.addEventListener("keydown",function(e){

keys[e.code]=true;



if(e.code==="Space"){


if(
Math.abs(player.x-ball.x)<70 &&
Math.abs(player.y-ball.y)<70
){


if(player.x<ball.x){

ball.speedX=10;

}else{

ball.speedX=-10;

}


}


}


});





document.addEventListener("keyup",function(e){

keys[e.code]=false;

});






function gameLoop(){



ctx.clearRect(0,0,900,500);



// 잔디

ctx.fillStyle="#14833b";

ctx.fillRect(0,0,900,500);



// 중앙선

ctx.strokeStyle="white";

ctx.lineWidth=3;

ctx.beginPath();

ctx.moveTo(450,0);

ctx.lineTo(450,500);

ctx.stroke();



// 골대

ctx.strokeRect(0,180,40,140);

ctx.strokeRect(860,180,40,140);



// 이동

if(keys["ArrowLeft"])
player.x-=5;


if(keys["ArrowRight"])
player.x+=5;


if(keys["ArrowUp"])
player.y-=5;


if(keys["ArrowDown"])
player.y+=5;



// 공 이동

ball.x+=ball.speedX;


ball.speedX*=0.97;



// 선수

drawCircle(player);

drawCircle(enemy);



// 공

ctx.fillStyle="white";

ctx.beginPath();

ctx.arc(ball.x,ball.y,12,0,Math.PI*2);

ctx.fill();



// 골

if(ball.x<0){

alert("홍명보 팀 골!");

resetBall();

}



if(ball.x>900){

alert("감스트 팀 골!");

resetBall();

}



requestAnimationFrame(gameLoop);


}






function drawCircle(obj){

ctx.fillStyle=obj.color;

ctx.beginPath();

ctx.arc(obj.x,obj.y,30,0,Math.PI*2);

ctx.fill();

}





function resetBall(){

ball.x=450;

ball.speedX=0;

}



</script>


</body>
</html>
