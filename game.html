<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>감스트 VS 홍명보</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
background:#07101c;
color:white;
font-family:sans-serif;
overflow:auto;

}


.page{

width:100%;
min-height:100vh;

display:flex;
flex-direction:column;

align-items:center;

justify-content:flex-start;

padding-top:20px;

}


.hide{

display:none;

}


h1{

font-size:32px;

color:#f39c12;

margin:10px;

}


button{

width:260px;

padding:15px;

margin:10px;

font-size:20px;

font-weight:bold;

border:0;

border-radius:12px;

}


.start{

background:#f39c12;

}


.gamst{

background:#f1c40f;

}


.hmb{

background:#e74c3c;

color:white;

}


canvas{

width:95%;

max-width:900px;

height:auto;

border:3px solid white;

background:#14833b;

}


.info{

font-size:20px;

margin:10px;

}


</style>

</head>


<body>



<!-- 첫 화면 -->

<div id="startPage" class="page">


<h1>
⚽ SQUAD SHOWDOWN
</h1>


<h2>
감스트 VS 홍명보
</h2>


<button class="start" onclick="goSelect()">

게임 시작

</button>


</div>




<!-- 팀 선택 -->

<div id="selectPage" class="page hide">


<h1>
팀 선택
</h1>


<div class="info">

감스트 투표:
<span id="gv">0</span>

<br>

홍명보 투표:
<span id="hv">0</span>

</div>



<button class="gamst" onclick="startGame('gamst')">

감스트 팀 선택

</button>



<button class="hmb" onclick="startGame('hmb')">

홍명보 팀 선택

</button>


</div>





<!-- 경기 -->

<div id="gamePage" class="page hide">


<h1 id="teamName">

</h1>


<canvas id="field" width="900" height="450"></canvas>


<p>
방향키 이동 / 스페이스 공격
</p>


</div>





<script>


let canvas=document.getElementById("field");

let ctx=canvas.getContext("2d");



let gamst=0;

let hmb=0;


let started=false;


let myTeam="";



let player={

x:150,

y:225,

color:"#f1c40f"

};


let enemy={

x:750,

y:225,

color:"#e74c3c"

};



let ball={

x:450,

y:225,

speed:0

};



let keys={};




function goSelect(){


document.getElementById("startPage").classList.add("hide");


document.getElementById("selectPage").classList.remove("hide");


}





function startGame(team){



myTeam=team;



if(team=="gamst"){


gamst++;

player.x=150;

player.color="#f1c40f";


}else{


hmb++;

player.x=750;

player.color="#e74c3c";


}



document.getElementById("gv").innerHTML=gamst;

document.getElementById("hv").innerHTML=hmb;



document.getElementById("selectPage").classList.add("hide");


document.getElementById("gamePage").classList.remove("hide");



document.getElementById("teamName").innerHTML=

team=="gamst"?"감스트 팀":"홍명보 팀";



if(!started){

started=true;

loop();

}



}






document.addEventListener("keydown",e=>{


keys[e.code]=true;



if(e.code=="Space"){


if(Math.abs(player.x-ball.x)<70){


ball.speed=

player.x<450?8:-8;


}


}


});



document.addEventListener("keyup",e=>{

keys[e.code]=false;

});







function loop(){


ctx.clearRect(0,0,900,450);



// 잔디

ctx.fillStyle="#14833b";

ctx.fillRect(0,0,900,450);



// 중앙선

ctx.strokeStyle="white";

ctx.beginPath();

ctx.moveTo(450,0);

ctx.lineTo(450,450);

ctx.stroke();



// 이동

if(keys["ArrowLeft"])
player.x-=5;


if(keys["ArrowRight"])
player.x+=5;


if(keys["ArrowUp"])
player.y-=5;


if(keys["ArrowDown"])
player.y+=5;



// 공

ball.x+=ball.speed;

ball.speed*=0.97;



// 선수

drawPlayer(player);

drawPlayer(enemy);



// 공 그리기

ctx.fillStyle="white";

ctx.beginPath();

ctx.arc(ball.x,ball.y,12,0,Math.PI*2);

ctx.fill();




requestAnimationFrame(loop);


}






function drawPlayer(p){


ctx.fillStyle=p.color;


ctx.beginPath();

ctx.arc(
p.x,
p.y,
25,
0,
Math.PI*2
);


ctx.fill();


}



</script>


</body>
</html>
<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<title>감스트 vs 홍명보 축구게임</title>


<style>

body{

margin:0;
overflow:hidden;
background:#1b8f2c;
font-family:sans-serif;

}


/* 점수 */

#score{

position:absolute;
top:20px;
width:100%;
text-align:center;

font-size:40px;
color:white;

text-shadow:2px 2px black;

}


/* 경기장 */

#field{

position:absolute;

width:800px;
height:450px;

left:50%;
top:50%;

transform:translate(-50%,-50%);

background:
linear-gradient(#35b94a,#198b30);

border:8px solid white;

}


/* 골대 */

.goal{

position:absolute;

width:100px;
height:180px;

top:135px;

border:5px solid white;

}


#leftGoal{

left:-10px;

}


#rightGoal{

right:-10px;

}



/* 선수 */

.player{

position:absolute;

width:60px;
height:60px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

color:white;
font-weight:bold;

}


#gam{

background:#ff3b30;

left:100px;
top:195px;

}


#hong{

background:#0066ff;

right:100px;
top:195px;

}



/* 공 */

#ball{

position:absolute;

width:30px;
height:30px;

background:white;

border-radius:50%;

left:385px;
top:210px;

}


/* 슛 버튼 */

#shoot{

position:absolute;

bottom:30px;
left:50%;

transform:translateX(-50%);

font-size:30px;

padding:15px 50px;

border-radius:20px;

background:#ff9800;

color:white;

border:none;

}


</style>

</head>



<body>


<div id="score">

감스트 0 : 0 홍명보

</div>


<div id="field">


<div class="goal" id="leftGoal"></div>

<div class="goal" id="rightGoal"></div>


<div class="player" id="gam">
감스트
</div>


<div class="player" id="hong">
홍명보
</div>


<div id="ball"></div>


</div>


<button id="shoot">
⚽ 슛
</button>



<script>


let gamScore=0;
let hongScore=0;


let ball=document.getElementById("ball");


let gam=document.getElementById("gam");



/* 감스트 움직임 */

document.addEventListener(
"keydown",
function(e){


let x=gam.offsetLeft;
let y=gam.offsetTop;


if(e.key=="ArrowUp")
y-=20;


if(e.key=="ArrowDown")
y+=20;


if(e.key=="ArrowLeft")
x-=20;


if(e.key=="ArrowRight")
x+=20;


gam.style.left=x+"px";
gam.style.top=y+"px";


});





// 슛

document.getElementById("shoot")
.onclick=function(){


let target=Math.random();


if(target>0.5){

hongScore++;

alert("⚽ 감스트 골!");

}

else{

gamScore++;

alert("🧤 홍명보 선방!");

}



document.getElementById("score").innerHTML=

"감스트 "+gamScore+
" : "+
hongScore+
" 홍명보";


};



</script>


</body>
</html>
