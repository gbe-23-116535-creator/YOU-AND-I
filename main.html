<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQUAD BATTLE: 감스트 vs 홍명보</title>
    <style>
        /* 기본 스타일 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, sans-serif;
        }

        body {
            background-color: #050b14;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* 전체 페이지 스크롤을 막고 내부 진영만 스크롤하도록 설정 */
        }

        /* 배틀그라운드 풍 상단 UI */
        nav {
            width: 100%;
            padding: 15px 30px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .back-btn {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .back-btn:hover { color: #ffffff; }

        .battle-title {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-align: center;
            color: #f39c12;
            text-shadow: 0 0 10px rgba(243, 156, 18, 0.5);
        }

        .live-status {
            background-color: #e74c3c;
            color: white;
            padding: 4px 10px;
            border-radius: 3px;
            font-size: 0.75rem;
            font-weight: 900;
            letter-spacing: 1px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            50% { opacity: 0.4; }
        }

        /* 📊 상단 실시간 스코어보드 (배그 매치 스타일) */
        .scoreboard {
            width: 100%;
            max-width: 800px;
            margin: 10px auto;
            padding: 15px 20px;
            background: rgba(17, 24, 39, 0.85);
            border: 2px solid #2c3e50;
            border-radius: 6px;
            z-index: 10;
        }

        .score-header {
            display: flex;
            justify-content: space-between;
            font-weight: 900;
            font-size: 1rem;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .gamst-team-text { color: #f1c40f; text-shadow: 0 0 5px rgba(241, 196, 15, 0.3); }
        .hmb-team-text { color: #e74c3c; text-shadow: 0 0 5px rgba(231, 76, 60, 0.3); }

        .vs-bar-wrapper {
            width: 100%;
            height: 20px;
            background-color: #111;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            border: 1px solid #444;
        }

        .vs-bar {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 900;
            color: #000000;
            transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .bar-gamst { background: linear-gradient(90deg, #f39c12, #f1c40f); }
        .bar-hmb { background: linear-gradient(90deg, #e74c3c, #c0392b); }

        /* ⚔️ 좌우 50:50 배틀 아레나 레이아웃 */
        .battle-arena {
            flex: 1;
            display: flex;
            width: 100%;
            position: relative;
        }

        /* 정중앙 스플릿 선 및 VS 마크 */
        .arena-divider {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, #f1c40f 0%, #e74c3c 100%);
            z-index: 5;
            transform: translateX(-50%);
        }

        .arena-vs-tag {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            background: #111;
            color: #fff;
            border: 3px solid #fff;
            font-size: 1.5rem;
            font-weight: 900;
            padding: 5px 15px;
            z-index: 6;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        /* 개별 캠프(진영) 설정 */
        .camp {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px 40px;
            position: relative;
            height: calc(100vh - 120px); /* 전체 화면에서 상단 바 제외 */
        }

        /* 진영별 고유 테마 분위기 설정 */
        .camp-gamst {
            background: linear-gradient(135deg, rgba(20, 15, 5, 0.95), rgba(5, 5, 5, 0.98));
        }

        .camp-hmb {
            background: linear-gradient(135deg, rgba(20, 5, 5, 0.95), rgba(5, 5, 5, 0.98));
        }

        /* 진영 프로필 헤더 */
        .camp-hero {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }

        .camp-avatar {
            width: 64px;
            height: 64px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            border: 2px solid;
        }

        .camp-gamst .camp-avatar { border-color: #f1c40f; background: #e67e22; }
        .camp-hmb .camp-avatar { border-color: #e74c3c; background: #962d22; }

        .camp-info h2 {
            font-size: 1.4rem;
            font-weight: 900;
            margin-bottom: 4px;
        }

        .camp-info p {
            font-size: 0.85rem;
            color: #7f8c8d;
        }

        /* 💬 진영별 피드 (여기에 각자 글이 싸움하듯 올라옴) */
        .battle-feed {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 10px;
            margin-bottom: 20px;
        }

        .battle-feed::-webkit-scrollbar { width: 4px; }
        .battle-feed::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

        /* 한 줄 평 카드 */
        .combat-card {
            padding: 14px 16px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.03);
            border-left: 4px solid;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: dropIn 0.3s ease-out;
        }

        @keyframes dropIn {
            from { opacity: 0; transform: scale(0.98) translateY(-5px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .camp-gamst .combat-card { border-left-color: #f1c40f; border-right: 1px solid rgba(241, 196, 15, 0.1); }
        .camp-hmb .combat-card { border-left-color: #e74c3c; border-right: 1px solid rgba(231, 76, 60, 0.1); }

        .card-meta {
            font-size: 0.8rem;
            font-weight: 700;
            color: #7f8c8d;
            margin-bottom: 4px;
        }

        /* ⌨️ 진영별 독립 입력 폼 */
        .combat-input-zone {
            display: flex;
            gap: 8px;
            background: rgba(0,0,0,0.4);
            padding: 10px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .combat-input {
            flex: 1;
            background: #000000;
            border: 1px solid #333;
            border-radius: 2px;
            padding: 12px 16px;
            color: white;
            font-size: 0.9rem;
            outline: none;
        }

        .camp-gamst .combat-input:focus { border-color: #f1c40f; }
        .camp-hmb .combat-input:focus { border-color: #e74c3c; }

        .combat-btn {
            border: none;
            padding: 0 20px;
            font-weight: 900;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 2px;
            text-transform: uppercase;
        }

        .camp-gamst .combat-btn { background-color: #f1c40f; color: #000; }
        .camp-hmb .combat-btn { background-color: #e74c3c; color: #fff; }

        /* 반응형 레이아웃 (모바일에서는 위아래 스플릿으로 자동 전환) */
        @media (max-width: 850px) {
            body { overflow-y: auto; }
            .battle-arena { flex-direction: column; }
            .camp { height: 450px; padding: 20px; }
            .arena-divider { left: 0; right: 0; top: 50%; width: 100%; height: 2px; transform: translateY(-50%); }
            .arena-vs-tag { top: 50%; left: 50%; }
        }
    </style>
</head>

    <!-- 상단 매치 레이더 내비게이션 -->
    <nav>
        <a href="index.html" class="back-btn">← 대문 탈출</a>
        <div class="battle-title">SQUAD CONFLICT ARENA</div>
        <div class="live-status">PHASE 1 - LIVE</div>
    </nav>

    <!-- 실시간 스코어 중계현황판 -->
    <section class="scoreboard">
        <div class="score-header">
            <span class="gamst-team-text">GAMST SQUAD (<span id="scoreGamst">1,240</span>)</span>
            <span class="hmb-team-text">HMB TEAM (<span id="scoreHmb">980</span>)</span>
        </div>
        <div class="vs-bar-wrapper">
            <div id="barGamst" class="vs-bar bar-gamst" style="width: 56%">56%</div>

        </div>
    </section>

    <!-- 배틀그라운드 스플릿 아레나 구역 -->
    <div class="battle-arena">
        
        <!-- 중앙 데코레이션 가름선 및 타이틀 -->
        <div class="arena-divider"></div>
        <div class="arena-vs-tag">VS</div>

        <!-- 💥 왼쪽 진영 : 감스트 스쿼드 (팬 민심 캠프) -->
        <section class="camp camp-gamst">
            <div class="camp-hero">
