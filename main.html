<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>끝장 토론: 대한민국 축구의 운명</title>
    <style>
        /* 기본 스타일 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, sans-serif;
        }

        body {
            background-color: #0c192c;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* 네비게이션 바 */
        nav {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .back-btn:hover {
            color: #ffffff;
        }

        .live-badge {
            background-color: #d1232a;
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 700;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.5; }
        }

        /* 메인 컨테이너 */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 60px 20px;
            flex: 1;
        }

        /* 토론 헤더 */
        .debate-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .debate-header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .debate-header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        /* 📊 실시간 투표 게이지 바 스타일 */
        .poll-container {
            background-color: #112240;
            border: 1px solid #1e3a8a;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .poll-header {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 12px;
        }

        .gamst-color { color: #eab308; }
        .hmb-color { color: #f43f5e; }

        .progress-bar-wrapper {
            width: 100%;
            height: 24px;
            background-color: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
        }

        .progress-bar {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 800;
            color: #0c192c;
            transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .progress-gamst { background-color: #eab308; }
        .progress-hmb { background-color: #f43f5e; }

        /* 1:1 토론 매치업 매트릭스 */
        .matchup-grid {
            display: grid;
            grid-template-columns: 1fr 120px 1fr;
            gap: 20px;
            align-items: center;
            background-color: #112240;
            border: 1px solid #1e3a8a;
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* 토론자 프로필 */
        .debater {
            text-align: center;
        }

        .debater-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #1e293b;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            border: 3px solid #334155;
        }

        .gamst .debater-avatar {
            border-color: #eab308;
            background: linear-gradient(135deg, #1e293b, #451a03);
        }

        .hmb .debater-avatar {
            border-color: #d1232a;
            background: linear-gradient(135deg, #1e293b, #1e1b4b);
        }

        .debater-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .debater-title {
            font-size: 0.9rem;
            color: #38bdf8;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .quote-box {
            background-color: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
            padding: 15px;
            font-size: 1rem;
            line-height: 1.5;
            color: #cbd5e1;
            text-align: left;
            border-left: 4px solid #475569;
        }

        .gamst .quote-box { border-left-color: #eab308; }
        .hmb .quote-box { border-left-color: #d1232a; }

        /* VS 영역 */
        .vs-zone {
            text-align: center;
        }

        .vs-circle {
            width: 70px;
            height: 70px;
            background-color: #d1232a;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.5rem;
            margin: 0 auto;
            box-shadow: 0 0 20px rgba(209, 35, 42, 0.5);
        }

        /* 실시간 토론 참여/댓글 섹션 */
        .chat-section {
            background-color: #112240;
            border: 1px solid #233554;
            border-radius: 16px;
            padding: 30px;
        }

        .chat-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-count {
            font-size: 0.9rem;
            color: #94a3b8;
            font-weight: 400;
        }

        .chat-box {
            max-height: 350px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
            padding-right: 10px;
        }

        /* 스크롤바 디자인 */
        .chat-box::-webkit-scrollbar { width: 6px; }
        .chat-box::-webkit-scrollbar-track { background: #0c192c; }
        .chat-box::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

        .chat-message {
            background-color: #1e293b;
            padding: 15px;
            border-radius: 8px;
            animation: fadeInUp 0.4s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }

        .user-name {
            font-weight: 700;
        }

        .user-pick.pick-gamst { color: #eab308; }
        .user-pick.pick-hmb { color: #f43f5e; }

        .message-text {
            font-size: 0.95rem;
            color: #e2e8f0;
            line-height: 1.4;
        }

        /* 입력 폼 */
        .input-group {
            display: flex;
            gap: 10px;
        }

        .select-pick {
            background-color: #1e293b;
            color: white;
            border: 1px solid #334155;
            padding: 0 15px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }

        .chat-input {
            flex: 1;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 14px 20px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .chat-input:focus {
            border-color: #38bdf8;
        }

        .submit-btn {
            background-color: #38bdf8;
            color: #0c192c;
            border: none;
            padding: 0 24px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #7dd3fc;
        }

        /* 반응형 모바일 대응 */
        @media (max-width: 900px) {
            .matchup-grid {
                grid-template-columns: 1fr;
                padding: 24px;
                gap: 30px;
            }
            .vs-zone {
                order: -1;
                padding: 10px 0;
                border-bottom: 1px solid #233554;
            }
            .debate-header h1 { font-size: 1.8rem; }
            .input-group { flex-direction: column; }
            .select-pick, .submit-btn { padding: 14px; }
        }
    </style>
</head>
<body>

    <!-- 상단 네비게이션 -->
    <nav>
        <a href="index.html" class="back-btn">← 대문으로 돌아가기</a>
        <div class="live-badge">LIVE DEBATE</div>
    </nav>

    <div class="container">
        <!-- 상단 헤더 -->
        <header class="debate-header">
            <h1>끝장 라이브 토론</h1>
            <p>축구팬들의 민심 대변인 vs 대한민국 국가대표팀 사령탑</p>
        </header>

        <!-- 📊 실시간 지지율 투표 현황 라이브 스코어 보드 -->
        <section class="poll-container">
            <div class="poll-header">
                <span class="gamst-color">감스트 지지율 (<span id="countGamst">2054</span>표)</span>
                <span class="hmb-color">홍명보 지지율 (<span id="countHmb">1358</span>표)</span>
            </div>
            <div class="progress-bar-wrapper">
                <div id="barGamst" class="progress-bar progress-gamst" style="width: 60%">60%</div>
